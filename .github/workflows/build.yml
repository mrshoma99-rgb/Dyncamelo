name: build

on:
  push:
  pull_request:

jobs:
  windows:
    name: Windows (full solution)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Dyncamelo.sln

      - name: Build solution (Release)
        run: dotnet build Dyncamelo.sln -c Release --no-restore

      - name: Test Dyncamelo.Core.Tests
        run: dotnet test tests/Dyncamelo.Core.Tests/Dyncamelo.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Test Dyncamelo.Nodes.Tests
        run: dotnet test tests/Dyncamelo.Nodes.Tests/Dyncamelo.Nodes.Tests.csproj -c Release --no-build --verbosity normal

      - name: Test Dyncamelo.Integration.Tests
        run: dotnet test tests/Dyncamelo.Integration.Tests/Dyncamelo.Integration.Tests.csproj -c Release --no-build --verbosity normal

      # Real WPF: the editor control in an actual window on the runner's desktop
      # (wire anchors, collapse, overview zoom, classic layout, reroutes).
      - name: Test Dyncamelo.UI.Tests
        # --blame-hang names the test that hangs (a stuck WPF dispatcher would otherwise hold the job for hours).
        # The screenshot folder makes EditorScreenshotTests render the editor to PNG files (kept as a build artifact).
        env:
          DYNCAMELO_SCREENSHOT_DIR: ${{ github.workspace }}\screenshots
        run: dotnet test tests/Dyncamelo.UI.Tests/Dyncamelo.UI.Tests.csproj -c Release --no-build --verbosity normal --blame-hang-timeout 4m --blame-hang-dump-type none

      - name: Keep the editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: editor-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: Linux (non-WPF projects)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # WPF projects (Dyncamelo.UI, Dyncamelo.App) cannot build on Linux;
      # they are covered by the windows job above.
      - name: Build Dyncamelo.Core
        run: dotnet build src/Dyncamelo.Core/Dyncamelo.Core.csproj -c Release

      - name: Build Dyncamelo.Nodes
        run: dotnet build src/Dyncamelo.Nodes/Dyncamelo.Nodes.csproj -c Release

      - name: Build Dyncamelo.Navisworks
        run: dotnet build src/Dyncamelo.Navisworks/Dyncamelo.Navisworks.csproj -c Release

      - name: Build Dyncamelo.Cli
        run: dotnet build src/Dyncamelo.Cli/Dyncamelo.Cli.csproj -c Release

      - name: Test Dyncamelo.Core.Tests
        run: dotnet test tests/Dyncamelo.Core.Tests/Dyncamelo.Core.Tests.csproj -c Release --verbosity normal

      - name: Test Dyncamelo.Nodes.Tests
        run: dotnet test tests/Dyncamelo.Nodes.Tests/Dyncamelo.Nodes.Tests.csproj -c Release --verbosity normal

      - name: Test Dyncamelo.Integration.Tests
        run: dotnet test tests/Dyncamelo.Integration.Tests/Dyncamelo.Integration.Tests.csproj -c Release --verbosity normal

      - name: Node catalogue is current (docs/dyncamelo-nodes.json and docs/NODE_CATALOG.md)
        run: python3 tools/generate_node_catalog.py --check

      # The wiki is built with MkDocs (Material theme) from docs/wiki-src, the repository documents and the node catalogue.
      # Strict: a broken link, anchor or heading reference, or a picture or graph file that a page names and the repository
      # does not have, fails the job. (--draft would make the last two a warning.)
      - name: Wiki builds (tools/build_wiki.py, MkDocs strict)
        run: |
          pip install -r tools/wiki/requirements.txt
          python3 tools/build_wiki.py

      - name: Keep the wiki site
        uses: actions/upload-artifact@v4
        with:
          name: dyncamelo-wiki
          path: build/wiki-site
          if-no-files-found: error
          retention-days: 30

      - name: Autodesk App Store package builder works (tools/build_store_package.py)
        run: python3 tools/build_store_package.py --self-test

      - name: CLI smoke-run every runnable sample graph
        run: |
          set -e
          # Samples using Navisworks nodes can only run inside the Navisworks
          # host (their assemblies are host-only); they are covered by the
          # SampleGraphStaticValidation integration test instead. Smoke-run
          # only the general-purpose graphs here.
          ran=0
          for sample in samples/*.dyc; do
            if grep -q 'Dyncamelo\.Navisworks\.' "$sample"; then
              echo "skip (needs Navisworks host): $sample"
              continue
            fi
            echo "::group::dyncamelo run $sample"
            dotnet run --project src/Dyncamelo.Cli -c Release --no-build -- run "$sample"
            echo "::endgroup::"
            ran=$((ran+1))
          done
          if [ "$ran" -lt 1 ]; then echo "::error::No runnable samples were smoke-tested"; exit 1; fi
