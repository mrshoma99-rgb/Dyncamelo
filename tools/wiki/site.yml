# Addresses the wiki links to. tools/build_wiki.py reads this file and passes the values to MkDocs as `extra:`,
# where the header buttons, the announcement bar, the footer and the "edit this page" links use them.
# Change an address here, not in the templates.

# The "Get on GitHub" button and the GitHub links: the newest release.
github_url: https://github.com/mrshoma99-rgb/Dyncamelo/releases/latest

# The "Get on Autodesk App Store" button and the sentence in the announcement bar.
# EMPTY means "coming soon": the button is greyed out, says "Autodesk App Store - coming soon" and has no link, and the bar says
# the Autodesk App Store copy for professional use is coming soon. The listing does not exist yet.
# When it does, the owner puts the address of the real listing here between the quotes; the button and the bar then link to it.
app_store_url: ""

# The BIMCamel logo in the header and the "bimcamel.com" links.
bimcamel_url: https://www.bimcamel.com/plugins/dyncamelo

# The repository: the footer link and the base of the "edit this page" links (edit/main/<file>).
repo_url: https://github.com/mrshoma99-rgb/Dyncamelo
